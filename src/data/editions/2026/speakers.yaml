  org: "Data Engineering Pilipinas"
  org_short: "DEP"
  title: "Founder, Data Engineering Pilipinas"
  photo: "myk_ogbinar.jpg"
  bio: "Myk Ogbinar is head of data and analytics at San Miguel Corporation, where he leads enterprise-wide data, analytics and AI initiatives. He has helped organizations in IT, retail, energy, telecommunications, banking and conglomerates use data to improve customer engagement, marketing and operations. He holds a computer science degree, an MBA and a master of engineering in AI from UP Diliman, and is now pursuing a PhD. As founder of Data Engineering Pilipinas, he has built a community that makes data skills and open-source tools more accessible. He also mentors women in the FTW Foundation's Data Science Bootcamp."
